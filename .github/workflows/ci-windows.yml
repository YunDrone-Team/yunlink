name: Windows CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      CC: cl
      CXX: cl

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci-ninja

      - name: Build
        run: python3 tools/build_fast.py --preset ci-ninja

      - name: Test
        run: ctest --test-dir build/ci-ninja --output-on-failure

  bindings:
    runs-on: windows-latest
    env:
      CC: cl
      CXX: cl

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci-ninja

      - name: Build Core Bindings Targets
        run: cmake --build --preset ci-ninja --target yunlink_ffi test_c_ffi_v2

      - name: Test FFI Contracts
        run: ctest --test-dir build/ci-ninja -R "test_c_ffi_v2" --output-on-failure

      - name: Test Rust Bindings
        run: |
          cargo test --workspace --manifest-path bindings/rust/Cargo.toml

      - name: Test Python Bindings
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install pytest -e bindings/python
          .\.venv\Scripts\python -m pytest -q bindings/python/tests

      - name: Wheel Smoke
        shell: pwsh
        run: |
          python -m venv .venv-wheel
          .\.venv-wheel\Scripts\python -m pip install --upgrade pip
          .\.venv-wheel\Scripts\python -m pip wheel bindings/python -w output/python-wheel
