name: Python Wheels

on:
  push:
    branches:
      - main
      - "codex/**"
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            arch: arm64
          - platform: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - platform: linux-x86_64
            runner: ubuntu-latest
            arch: x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - platform: windows-x86_64
            runner: windows-latest
            arch: AMD64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {project}/bindings/python/tests
        with:
          package-dir: bindings/python
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  verify:
    name: Verify wheel matrix
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: wheelhouse

      - name: Verify platforms and Python versions
        run: python tools/bindings/verify_python_wheels.py wheelhouse

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          generate_release_notes: true
