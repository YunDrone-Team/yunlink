[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "yunlink"
version = "2.0.0"
description = "yunlink Python runtime bindings"
requires-python = ">=3.10"
dependencies = ["protobuf>=7.35.1"]

[tool.scikit-build]
wheel.packages = ["src/yunlink"]
