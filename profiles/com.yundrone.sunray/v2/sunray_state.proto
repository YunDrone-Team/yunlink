syntax = "proto3";

package com.yundrone.sunray.v2;

import "org.yunlink.mobility/v1/mobility.proto";

// Split from sunray.proto. Package and field numbers are unchanged.

enum ActiveControllerType {
  ACTIVE_CONTROLLER_UNKNOWN = 0;
  ACTIVE_CONTROLLER_PX4 = 1;
  ACTIVE_CONTROLLER_SO3 = 2;
  ACTIVE_CONTROLLER_MPC = 3;
  ACTIVE_CONTROLLER_NMPC = 4;
}

// Controller-confirmed flight state. This is deliberately not a PX4/MAVROS
// mirror: it contains only facts exposed by Sunray's public UAVControlState.
// Pose and twist are carried exclusively by mobility/Odometry.
message FlightControlState {
  uint64 source_stamp_ns = 1;
  bool armed = 2;
  bool landed = 3;
  uint32 control_mode = 4;
  uint32 control_state = 5;
  float battery_voltage_v = 6;
  uint32 battery_percent = 7;
  bool manual_override = 8;
  ActiveControllerType controller_type = 9;
}

message OdomStatus {
  uint64 source_stamp_ns = 1;
  bool valid = 2;
  uint32 source = 3;
  uint32 quality = 4;
  string message = 5;
}

// 本 profile 内的 TF 快照，语义与 geometry_msgs/TransformStamped 一致：
// child_frame_id 在 frame_id 下的表达（平移 + 四元数）。
// 中性的 mobility v1 目前没有 TF 类型，不为这条需求去动它。
message TransformStamped {
  uint64 source_stamp_ns = 1;
  string frame_id = 2;
  string child_frame_id = 3;
  org.yunlink.mobility.v1.Pose transform = 4;
}

message OdomState {
  uint64 source_stamp_ns = 1;
  string frame_id = 2;
  bool valid = 3;                                   // local（语义不变）
  org.yunlink.mobility.v1.Odometry odometry = 4;    // local（语义不变）
  uint32 source = 5;

  // ↓↓↓ 2.9 新增：全局那一半（编号从 6 起，不动已有编号，protobuf 向前兼容）
  //
  // global_odometry.source_stamp_ns == 0 严格表示"当前没有有效全局位姿"：
  // 此字段整体缺省（has_global_odometry() == false），既不给零位姿、也不沿用上一帧。
  org.yunlink.mobility.v1.Odometry global_odometry = 6;
  // 独立判据，不复用 local 的 valid；恒等于 (global_odometry.source_stamp_ns != 0)。
  // 与 RelocalizationStateSnapshot.pose_valid 的关系：pose_valid == false ⇒ 这里必须为 false。
  bool global_odom_valid = 7;
  // 帧名一律用 "{agent}/…" 全限定形式（与 local_odom.header.frame_id 同一口径）。
  string world_frame_name = 8;
  string global_frame_name = 9;
  string local_frame_name = 10;
  string base_frame_name = 11;
  // 三个 TF 仅在各自前提到位时给出；global_to_local_tf 是 global 位姿能否与
  // 先验地图对齐叠加的前提，缺它 global 位姿只能显示成数字。
  TransformStamped world_to_global_tf = 12;
  TransformStamped global_to_local_tf = 13;
  TransformStamped local_to_base_tf = 14;
}

// Sunray Profile 2.9. One atomic localization snapshot per entity.
// Coordinates: metres, seconds, radians; right handed, Z up; quaternion xyzw.
// source_sequence advances only for a new trusted input, never for a heartbeat.
enum LocalizationStatus {
  LOCALIZATION_WAITING = 0;
  LOCALIZATION_VALID = 1;
  LOCALIZATION_PUBLISHER_MISSING = 2;
  LOCALIZATION_STALE = 3;
  LOCALIZATION_INVALID = 4;
  LOCALIZATION_TRANSFORM_UNAVAILABLE = 5;
}

message LocalizationState {
  string localization_epoch = 1;
  uint64 source_sequence = 2;
  uint64 source_stamp_ns = 3;
  uint32 source_id = 4;
  double input_rate_hz = 5;
  uint64 input_age_ms = 6;
  LocalizationStatus status = 7;
  string reason = 8;
  org.yunlink.mobility.v1.Odometry local_odometry = 9;
  string scene_frame_id = 10;
  // Maps local coordinates into scene coordinates; never implied identity.
  org.yunlink.mobility.v1.Pose scene_from_local = 11;
  bool scene_transform_valid = 12;
  // Reference frame of both linear and angular velocity in local_odometry.
  string velocity_frame_id = 13;
  // Advances on relocalization even if frame names remain unchanged.
  uint64 reference_revision = 14;
}
