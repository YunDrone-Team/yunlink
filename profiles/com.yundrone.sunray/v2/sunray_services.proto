syntax = "proto3";

package com.yundrone.sunray.v2;

// Split from sunray.proto. Package and field numbers are unchanged.

message GimbalParams {
  reserved 1, 6;
  double roll_rad = 2;
  double pitch_rad = 3;
  double yaw_rad = 4;
  double zoom = 5;
  bool connected = 7;
  double roll_rate_rad_s = 8;
  double pitch_rate_rad_s = 9;
  double yaw_rate_rad_s = 10;
}

message GimbalAngleGoal {
  double yaw_rad = 1;
  double pitch_rad = 2;
}

message GimbalRateGoal {
  int32 yaw_control = 1;
  int32 pitch_control = 2;
}

message GimbalCenterGoal {}

message GimbalZoomAbsoluteGoal {
  double zoom = 1;
}

message RuntimeDiagnostic {
  uint64 source_stamp_ns = 1;
  uint32 level = 2;
  string component = 3;
  string message = 4;
  map<string, string> values = 5;
}

message VehicleEvent {
  uint64 source_stamp_ns = 1;
  string kind = 2;
  uint32 code = 3;
  string message = 4;
  map<string, string> attributes = 5;
}

message EmptyGoal {}

// Point-cloud accumulation control and status.  This is intentionally a small
// typed extension: the Livox driver already owns the ROS services and exposes
// diagnostics, while YunLink only carries the remote operation and summary.
message MappingStartRequest {}
message MappingStartResponse {
  bool success = 1;
  string message = 2;
}

message MappingStopRequest {}
message MappingStopResponse {
  bool success = 1;
  string message = 2;
}

message MappingLidarState {
  string lidar_name = 1;
  string lidar_topic = 2;
  string imu_topic = 3;
  double lidar_rate_hz = 4;
  double imu_rate_hz = 5;
  bool pointcloud_accumulating = 6;
  uint64 pointcloud_frame_count = 7;
  bool lidar_running = 8;
  double lidar_age_sec = 9;
  double imu_age_sec = 10;
  uint32 lidar_point_num = 11;
  uint32 lidar_actual_count = 12;
}

message MappingState {
  uint64 source_stamp_ns = 1;
  string status = 2;
  string error = 3;
  repeated MappingLidarState lidars = 4;
}

// These values mirror the stable ROS FeatureSummary contract. This v2 profile
// is a hard cut: the old supervisor runtime-state enum is not carried on Wire.
enum FeatureCategory {
  FEATURE_CATEGORY_UNKNOWN = 0;
  FEATURE_CATEGORY_CORE = 1;
  FEATURE_CATEGORY_EXAMPLE = 2;
  FEATURE_CATEGORY_BASIC = 3;
}

enum FeatureHealthState {
  FEATURE_HEALTH_STOPPED = 0;
  FEATURE_HEALTH_RUNNING = 1;
  FEATURE_HEALTH_RUNNING_UNHEALTHY = 2;
  FEATURE_HEALTH_UNAVAILABLE = 3;
}

message FeatureDescriptor {
  string name = 1;
  string display_name = 2;
  string group_name = 3;
  string group_display_name = 4;
  string description = 5;
  FeatureCategory category = 6;
  bool check_health = 7;
  FeatureHealthState health_state = 8;
  string health_message = 9;
  bool auto_start = 10;
  string start_preview_command = 11;
  string demo_id = 12;
  TeamDemoLifecycleMode lifecycle_mode = 13;
  string target_scope = 14;
}

enum TeamDemoLifecycleMode {
  TEAM_DEMO_LIFECYCLE_UNSPECIFIED = 0;
  TEAM_DEMO_MANAGED_TAKEOFF_LAND = 1;
  TEAM_DEMO_REQUIRES_AIRBORNE = 2;
  TEAM_DEMO_MANAGED_TAKEOFF_THEN_GOAL = 3;
}

message FeatureListRequest {}
message FeatureListResponse {
  bool success = 1;
  string message = 2;
  repeated FeatureDescriptor features = 3;
}
message FeatureGetRequest { string name = 1; }
message FeatureGetResponse {
  bool success = 1;
  string message = 2;
  FeatureDescriptor feature = 3;
}
message FeatureStartRequest { string name = 1; }
message FeatureStartResponse {
  bool success = 1;
  string message = 2;
  string name = 3;
}
message FeatureStopRequest { string name = 1; }
message FeatureStopResponse {
  bool success = 1;
  string message = 2;
  string name = 3;
}

message TeamDemoStartRequest {
  string demo_id = 1;
  string target_agent_name = 2;
  uint32 target_agent_id = 3;
}
message TeamDemoStartResponse {
  bool success = 1;
  string message = 2;
  string demo_id = 3;
  string target_agent_name = 4;
  uint32 target_agent_id = 5;
}

// ---------------------------------------------------------------------------
// 重定位：先验地图激活与播种（Sunray Open3D 全局定位）
//
// 定位节点持有"一张生效地图 + 一个 odom->map 变换"。换图会让旧变换的语义完全失效，
// 因此 activate_map 与 seed 都是**地面专用**操作：Bridge 侧与数据文件上传共用同一把
// 安全门禁（UAV 未解锁 / UGV HOLD），飞行中一律拒绝。
// ---------------------------------------------------------------------------

// 地图激活。path 是先验地图在端点文件系统上的绝对路径（通常由 MediaFilePut 先落地）。
message RelocalizationActivateMapRequest {
  string path = 1;
}
message RelocalizationActivateMapResponse {
  bool accepted = 1;
  // 拒绝或失败原因，必须可直接展示给操作员。
  string message = 2;
  // 生效后的地图身份，便于客户端确认"我激活的是哪一张"。
  string active_path = 3;
  uint64 point_count = 4;
}

// 播种：给出机体在地图中的大致位姿，由机上 ICP 收敛到精确位姿。
// 朝向用 yaw（弧度，绕地图 z 轴）表达；roll/pitch 缺省由机上按 IMU 重力对齐处理，
// 因此客户端通常只需要给 x/y/z/yaw 四个量。
message RelocalizationSeedRequest {
  double x = 1;
  double y = 2;
  double z = 3;
  // 弧度，绕地图 z 轴。
  double yaw = 4;
  // 为 true 时 roll/pitch 生效；为 false 时由机上使用重力对齐值。
  bool has_roll_pitch = 5;
  double roll = 6;
  double pitch = 7;
}
message RelocalizationSeedResponse {
  bool accepted = 1;
  string message = 2;
  // 单调递增，用于客户端关联"哪一次播种被采纳"。
  uint64 seed_id = 3;
}

// 定位链路状态快照。Bridge 订阅机上 sunray_msgs/RelocalizationState 后按 stream 转发。
//
// 用类型化消息而不是 JSON 字符串：字段改名能在编译期暴露，且不需要在 Bridge 里
// 引入 JSON 解析依赖。字段与 common/sunray_msgs/localization/msg/RelocalizationState.msg
// 一一对应。
message RelocalizationStateSnapshot {
  // idle / loading / seeded / converging / active / failed / degraded
  string state = 1;
  // 当前生效的先验地图（机上解析后的绝对路径）。
  string map_path = 2;
  uint64 point_count = 3;
  // 失败或降级原因，可直接展示给操作员。
  string detail = 4;
  // 机上已接收并采纳的播种次数（每次收到 /initialpose 递增）。
  // 用途：让客户端确认"我这次点选已经到达机上"。
  // 注意它与 RelocalizationSeedResponse.seed_id 是**两个独立计数器**：后者是
  // "Bridge 受理并转发了几次"，前者是"机上实际收到几次"。两者都单调递增，但
  // Bridge 或节点重启后起点不同，不要当作同一个编号使用。
  uint64 seed_id_accepted = 5;
  // false 表示当前没有有效的全局位姿，下游不得据此定位。
  bool pose_valid = 6;
  // 与 /localization_3d_confidence 同源。
  double confidence = 7;
  uint64 source_stamp_ns = 8;
}

// 2.18 Endpoint startup queue. Mutations require revision + run_id from Get.
// Commands acknowledge immediately; poll Get for asynchronous progress.
message StartupQueueItem {
  string feature_name = 1;
  bool enabled = 2;
  string completion_mode = 3; // delay | health
  double delay_sec = 4;
  double timeout_sec = 5;
  string display_name = 6;
  repeated string depends_on = 7;
  bool health_supported = 8;
  bool pinned = 9;
  bool is_protected = 10;
  string status = 11;
  string message = 12;
  double started_at = 13;
  double finished_at = 14;
  double elapsed_sec = 15;
  bool auto_start_locked = 16; // enabled 由设备策略决定（当前：随集群模式）；仍可调整顺序
}
message StartupQueueSnapshot {
  uint32 schema_version = 1;
  uint64 revision = 2;
  string run_id = 3;
  string state = 4;
  int32 current_index = 5;
  string config_warning = 6;
  repeated StartupQueueItem items = 7;
}
message StartupQueueRequest {
  string action = 1; // get | save | start | retry | skip | stop
  uint64 expected_revision = 2;
  string expected_run_id = 3;
  repeated StartupQueueItem items = 4; // save only; complete table
}
message StartupQueueResponse {
  bool success = 1;
  string message = 2;
  StartupQueueSnapshot snapshot = 3;
}

// ↓↓↓ 2.19 新增：运行期 Team / 协同模式（动态编排层）。
//
// 背景：`TEAM_MODE` 原本是**设备环境**字段（update_policy=device_reboot），改它要重启整机；
// 而"这一轮实验要不要协同"是操作员事实，必须能在运行期表达。因此 Team 模式上移为
// `sunray_system` 的运行期编排能力：地面站下发本 RPC → 机侧写运行期权威值并重启当前在跑的
// 集群控制 Feature（UAV/UGV 的 swarm_control）带 `external_planner := enabled`。
//
// 语义：
//   · enabled=true  → 平台按 Team 模式运行：swarm_control 消费外部规划器参考，
//                     地面站据此出现「协同集群」（机侧属性 sunray.team_mode 同时变 true）；
//   · enabled=false → 回到普通编队模式（参考链路拆除）。
//   · 只重启**当前在跑**的集群控制 Feature；没在跑的不动（不会把操作员没启动的功能偷偷拉起）。
//
// 与 FeatureStartRequest 的区别：那条是"启停某个 Feature"的通用入口，需要在调用方拼
// external_planner 参数、并自行决定哪些 Feature 属于集群控制；本 action 把"模式"作为
// 一等公民，机侧负责挑 Feature、原子切换，并把结果回显成 enabled。
message SetTeamModeRequest {
  // true = 进入 Team / 协同模式；false = 回到普通编队模式。
  bool enabled = 1;
}

message SetTeamModeResponse {
  bool success = 1;
  // 操作员可见的原因；失败时给出具体 Feature 或原因。
  string message = 2;
  // 切换后机侧**当前有效**的模式（回读 /sunray/system_context/team_mode）。
  // 成功时等于请求值；失败时是保持不变的当前值，地面站据此把开关画回真实状态。
  bool enabled = 3;
}

// 飞控日志。目标必须是单个已附着实体。Bridge 按该实体的 MAVROS 命名空间
// 调用 /sunray_fc_log/list 与 /sunray_fc_log/pull，不在这里打开串口。
// pull 一次只接收一个编号，避免整批传输超过地面站 RPC 等待时间。
message FcLogListRequest {}

message FcLogEntry {
  int32 id = 1;
  uint64 size_bytes = 2;
  uint64 time_utc_s = 3;
}

message FcLogListResponse {
  bool success = 1;
  string message = 2;
  repeated FcLogEntry logs = 3;
}

message FcLogPullRequest {
  int32 id = 1;
}

// 从飞控按偏移直接读取一块。地面站边收边写入本机，不再等机载整份落盘。
message FcLogReadRequest {
  int32 id = 1;
  uint64 offset = 2;
  uint32 max_bytes = 3;
}

message FcLogReadResponse {
  bool success = 1;
  string message = 2;
  int32 id = 3;
  uint64 offset = 4;
  bytes data = 5;
  bool eof = 6;
  uint64 total_bytes = 7;
}

message FcLogPullResponse {
  bool success = 1;
  string message = 2;
  int32 id = 3;
  string relative_path = 4;
  uint64 size_bytes = 5;
}
