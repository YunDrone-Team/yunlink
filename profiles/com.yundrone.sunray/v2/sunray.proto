syntax = "proto3";

package com.yundrone.sunray.v2;

import "org.yunlink.mobility/v1/mobility.proto";

enum ActiveControllerType {
  ACTIVE_CONTROLLER_UNKNOWN = 0;
  ACTIVE_CONTROLLER_PX4 = 1;
  ACTIVE_CONTROLLER_SO3 = 2;
  ACTIVE_CONTROLLER_MPC = 3;
  ACTIVE_CONTROLLER_NMPC = 4;
}

// Controller-confirmed flight state. This is deliberately not a PX4/MAVROS
// mirror: it contains only facts exposed by Sunray's public UAVControlState.
// Pose and twist are carried exclusively by mobility/Odometry.
message FlightControlState {
  uint64 source_stamp_ns = 1;
  bool armed = 2;
  bool landed = 3;
  uint32 control_mode = 4;
  uint32 control_state = 5;
  float battery_voltage_v = 6;
  uint32 battery_percent = 7;
  bool manual_override = 8;
  ActiveControllerType controller_type = 9;
}

message OdomStatus {
  uint64 source_stamp_ns = 1;
  bool valid = 2;
  uint32 source = 3;
  uint32 quality = 4;
  string message = 5;
}

message OdomState {
  uint64 source_stamp_ns = 1;
  string frame_id = 2;
  bool valid = 3;
  org.yunlink.mobility.v1.Odometry odometry = 4;
  uint32 source = 5;
}

message UavControlFsmState {
  uint64 source_stamp_ns = 1;
  uint32 state = 2;
  uint32 last_state = 3;
  string detail = 4;
}

message UavControllerState {
  uint64 source_stamp_ns = 1;
  string controller_name = 2;
  bool active = 3;
  org.yunlink.mobility.v1.Vector3 position_error = 4;
  org.yunlink.mobility.v1.Vector3 velocity_error = 5;
  org.yunlink.mobility.v1.Vector3 output = 6;
}

message UavControl {
  uint32 control_cmd = 1;
  org.yunlink.mobility.v1.Vector3 desired_position_m = 2;
  org.yunlink.mobility.v1.Vector3 desired_velocity_mps = 3;
  org.yunlink.mobility.v1.Vector3 desired_acceleration_mps2 = 4;
  double desired_yaw_rad = 5;
  double desired_yaw_rate_radps = 6;
  uint32 yaw_mode = 7;
  uint32 controller_type = 8;
  org.yunlink.mobility.v1.Vector2 desired_body_xy_position_m = 9;
  org.yunlink.mobility.v1.Vector2 desired_body_xy_velocity_mps = 10;
  double fixed_height_m = 11;
}

enum UavYawMode {
  UAV_YAW_KEEP = 0;
  UAV_YAW_SET_ANGLE = 1;
  UAV_YAW_SET_RATE = 2;
}

enum UavControllerType {
  UAV_CONTROLLER_DEFAULT = 0;
  UAV_CONTROLLER_POSITION = 1;
  UAV_CONTROLLER_ATTITUDE = 2;
}

message YawTarget {
  UavYawMode mode = 1;
  double value = 2;
}

message HeightLock {
  double height_m = 1;
}

message WorldPositionTarget {
  string frame_id = 1;
  org.yunlink.mobility.v1.Vector3 position_m = 2;
}

message BodyPositionTarget {
  org.yunlink.mobility.v1.Vector2 body_xy_position_m = 1;
  double fixed_height_m = 2;
}

message TrajectorySetpointTarget {
  string frame_id = 1;
  org.yunlink.mobility.v1.Vector3 position_m = 2;
  org.yunlink.mobility.v1.Vector3 velocity_mps = 3;
  org.yunlink.mobility.v1.Vector3 acceleration_mps2 = 4;
}

message WorldVelocityTarget {
  string frame_id = 1;
  org.yunlink.mobility.v1.Vector3 velocity_mps = 2;
  HeightLock height_lock = 3;
}

message BodyVelocityTarget {
  org.yunlink.mobility.v1.Vector2 body_xy_velocity_mps = 1;
  double fixed_height_m = 2;
}

message UavDirectControlGoal {
  oneof target {
    WorldPositionTarget world_position = 1;
    BodyPositionTarget body_position = 2;
    TrajectorySetpointTarget trajectory_setpoint = 3;
    WorldVelocityTarget world_velocity = 4;
    BodyVelocityTarget body_velocity = 5;
  }
  YawTarget yaw = 6;
  UavControllerType controller = 7;
  uint32 lease_ms = 8;
}

message EmergencyKillGoal {
  bool confirmed = 1;
}

message TakeoffGoal {
  // Zero selects the UAV controller defaults.
  double takeoff_relative_height_m = 1;
  double takeoff_max_velocity_mps = 2;
}

message LandGoal {
  // Zero selects the UAV controller default.
  double land_max_velocity_mps = 1;
}

message HoverGoal {}

enum UavWaypointArrivalAction {
  UAV_WAYPOINT_NEXT = 0;
  UAV_WAYPOINT_HOLD_CURRENT_YAW = 1;
  UAV_WAYPOINT_HOLD_SET_YAW = 2;
}

enum UavMissionCompletionAction {
  UAV_MISSION_FINISH_HOVER = 0;
  UAV_MISSION_FINISH_RETURN_HOME_AND_LAND = 1;
  UAV_MISSION_FINISH_LAND_NOW = 2;
}

message UavWaypoint {
  org.yunlink.mobility.v1.Vector3 position_m = 1;
  double yaw_rad = 2;
  double hold_time_s = 3;
  UavWaypointArrivalAction arrival_action = 4;
}

message UavWaypointMissionGoal {
  string frame_id = 1;
  repeated UavWaypoint waypoints = 2;
  string task_name = 3;
  UavMissionCompletionAction completion_action = 4;
}

message UavNavGoal {
  string frame_id = 1;
  org.yunlink.mobility.v1.Vector3 position_m = 2;
  double yaw_rad = 3;
}

message UavReturnHomeGoal {}

message PlannerCancelTaskRequest {}
message PlannerCancelTaskResponse {
  bool accepted = 1;
  string message = 2;
}

message PlannerSetHomeRequest {
  org.yunlink.mobility.v1.Vector3 home_m = 1;
  string frame_id = 2;
}
message PlannerSetHomeResponse {
  bool accepted = 1;
  string message = 2;
}

enum UavPlanningMainState {
  UAV_PLANNING_MAIN_NOT_READY = 0;
  UAV_PLANNING_MAIN_WAIT_MISSION = 1;
  UAV_PLANNING_MAIN_TASK_MAIN = 2;
  UAV_PLANNING_MAIN_SAFETY_ESCAPE = 3;
}

enum UavPlanningTaskState {
  UAV_PLANNING_TASK_IDLE = 0;
  UAV_PLANNING_TASK_TAKEOFF = 1;
  UAV_PLANNING_TASK_WAIT_TRAJECTORY = 2;
  UAV_PLANNING_TASK_EXEC_TRAJECTORY = 3;
  UAV_PLANNING_TASK_HOLDING = 4;
  UAV_PLANNING_TASK_WAYPOINT_COMPLETED = 5;
  UAV_PLANNING_TASK_LAND = 6;
  UAV_PLANNING_TASK_FAILED = 7;
}

message UavPlanningState {
  UavPlanningMainState main_state = 1;
  UavPlanningTaskState task_state = 2;
  string task_name = 3;
  uint32 current_waypoint_index = 4;
  uint32 total_waypoints = 5;
  UavWaypoint current_waypoint = 6;
  double distance_to_goal_m = 7;
  double hold_remaining_s = 8;
  string failure_reason = 9;
  string planner_frame_id = 10;
}

message UavControlState {
  uint64 source_stamp_ns = 1;
  bool command_valid = 2;
  UavControl active_command = 3;
  uint32 fsm_state = 4;
  string diagnostic = 5;
}

message UgvControl {
  uint32 control_cmd = 1;
  org.yunlink.mobility.v1.Vector3 desired_position_m = 2;
  org.yunlink.mobility.v1.Vector3 desired_velocity_mps = 3;
  org.yunlink.mobility.v1.Twist body_twist = 4;
  double desired_yaw_rad = 5;
  double desired_wgs84_latitude_deg = 6;
  double desired_wgs84_longitude_deg = 7;
  double desired_wgs84_altitude_m = 8;
}

message UgvControlState {
  uint64 source_stamp_ns = 1;
  string frame_id = 2;
  string agent_name = 3;
  uint32 agent_id = 4;
  uint32 drive_type = 5;
  bool command_valid = 6;
  bool inside_geo_fence = 7;
  uint32 diagnostic_level = 8;
  string diagnostic_message = 9;
  uint32 fsm_state = 10;
  UgvControl active_command = 11;
  org.yunlink.mobility.v1.Odometry odometry = 12;
  org.yunlink.mobility.v1.Pose target_pose = 13;
  org.yunlink.mobility.v1.Twist controller_output = 14;
  bool odom_ready = 15;
}

enum UgvMovePointFrame {
  UGV_MOVE_LOCAL = 0;
  UGV_MOVE_BODY = 1;
}

enum UgvYawMode {
  UGV_YAW_KEEP = 0;
  UGV_YAW_SET = 1;
}

message UgvMovePointGoal {
  UgvMovePointFrame frame = 1;
  org.yunlink.mobility.v1.Vector3 point_m = 2;
  UgvYawMode yaw_mode = 3;
  double desired_yaw_rad = 4;
  string local_frame_id = 5;
}

message UgvLocalVelocityTarget {
  string frame_id = 1;
  org.yunlink.mobility.v1.Vector2 linear_mps = 2;
  double desired_yaw_rad = 3;
}

message UgvBodyVelocityTarget {
  org.yunlink.mobility.v1.Vector2 linear_mps = 1;
  double yaw_rate_radps = 2;
}

message UgvVelocityGoal {
  oneof target {
    UgvLocalVelocityTarget local = 1;
    UgvBodyVelocityTarget body = 2;
  }
  uint32 lease_ms = 3;
}

message UgvHoldGoal {}

message GimbalParams {
  reserved 1, 6;
  double roll_rad = 2;
  double pitch_rad = 3;
  double yaw_rad = 4;
  double zoom = 5;
  bool connected = 7;
  double roll_rate_rad_s = 8;
  double pitch_rate_rad_s = 9;
  double yaw_rate_rad_s = 10;
}

message GimbalAngleGoal {
  double yaw_rad = 1;
  double pitch_rad = 2;
}

message GimbalRateGoal {
  int32 yaw_control = 1;
  int32 pitch_control = 2;
}

message GimbalCenterGoal {}

message GimbalZoomAbsoluteGoal {
  double zoom = 1;
}

message RuntimeDiagnostic {
  uint64 source_stamp_ns = 1;
  uint32 level = 2;
  string component = 3;
  string message = 4;
  map<string, string> values = 5;
}

message VehicleEvent {
  uint64 source_stamp_ns = 1;
  string kind = 2;
  uint32 code = 3;
  string message = 4;
  map<string, string> attributes = 5;
}

message EmptyGoal {}

message FormationTaskGoal {
  string group_uid = 1;
  uint32 formation_shape = 2;
  double spacing_m = 3;
  string label = 4;
}

// These values mirror the stable ROS FeatureSummary contract. This v2 profile
// is a hard cut: the old supervisor runtime-state enum is not carried on Wire.
enum FeatureCategory {
  FEATURE_CATEGORY_UNKNOWN = 0;
  FEATURE_CATEGORY_CORE = 1;
  FEATURE_CATEGORY_EXAMPLE = 2;
  FEATURE_CATEGORY_BASIC = 3;
}

enum FeatureHealthState {
  FEATURE_HEALTH_STOPPED = 0;
  FEATURE_HEALTH_RUNNING = 1;
  FEATURE_HEALTH_RUNNING_UNHEALTHY = 2;
  FEATURE_HEALTH_UNAVAILABLE = 3;
}

message FeatureDescriptor {
  string name = 1;
  string display_name = 2;
  string group_name = 3;
  string group_display_name = 4;
  string description = 5;
  FeatureCategory category = 6;
  bool check_health = 7;
  FeatureHealthState health_state = 8;
  string health_message = 9;
  bool auto_start = 10;
  string start_preview_command = 11;
}

message FeatureListRequest {}
message FeatureListResponse {
  bool success = 1;
  string message = 2;
  repeated FeatureDescriptor features = 3;
}
message FeatureGetRequest { string name = 1; }
message FeatureGetResponse {
  bool success = 1;
  string message = 2;
  FeatureDescriptor feature = 3;
}
message FeatureStartRequest { string name = 1; }
message FeatureStartResponse {
  bool success = 1;
  string message = 2;
  string name = 3;
}
message FeatureStopRequest { string name = 1; }
message FeatureStopResponse {
  bool success = 1;
  string message = 2;
  string name = 3;
}
