syntax = "proto3";

package com.yundrone.sunray.v2;

import "org.yunlink.mobility/v1/mobility.proto";

// Split from sunray.proto. Package and field numbers are unchanged.

enum FormationType {
  FORMATION_UNKNOWN = 0;
  FORMATION_TAKEOFF = 1;
  FORMATION_LAND = 2;
  FORMATION_STATIC_LINE = 10;
  FORMATION_STATIC_POLYGON = 11;
  FORMATION_LEADER = 12;
  FORMATION_DYNAMIC_POLYGON = 20;
  FORMATION_DYNAMIC_RING = 21;
  FORMATION_DYNAMIC_LEMNISCATE = 22;
  // 13 (static double ring) and 23 (dynamic double ring) were removed. The
  // numbers are reserved and must never be reused; any new formation type
  // starts at 30.
  reserved 13, 23;
}

enum FormationPhase {
  FORMATION_PHASE_IDLE = 0;
  FORMATION_PHASE_TRANSITIONING = 1;
  FORMATION_PHASE_ACTIVE = 2;
  FORMATION_PHASE_DYNAMIC_STOPPED = 3;
  FORMATION_PHASE_ERROR = 4;
}

enum FormationLeaderTargetMode {
  FORMATION_LEADER_TARGET_UNSPECIFIED = 0;
  FORMATION_LEADER_TARGET_FIXED_POSE = 1;
  FORMATION_LEADER_TARGET_ODOM_TOPIC = 2;
}

message FormationTaskEpoch {
  uint64 domain_created_ns = 1;
  string origin_agent_id = 2;
  uint64 origin_sequence = 3;
}

message FormationLine {
  double spacing_m = 1;
  double angle_deg = 2;
}

message FormationPolygon {
  double side_length_m = 1;
  double move_speed_mps = 2;
}

message FormationRing {
  double radius_m = 1;
  double move_speed_mps = 2;
}

message FormationLemniscate {
  double x_scale_m = 1;
  double y_scale_m = 2;
  double move_speed_mps = 3;
}

message FormationLeader {
  repeated uint32 agent_slots = 1;
  double spacing_m = 2;
  repeated bool virtual_leader_slots = 3;
}

message FormationSetRequest {
  FormationType formation_type = 1;
  bool align_yaw_with_trajectory = 2;
  FormationLine line = 3;
  FormationPolygon polygon = 4;
  FormationRing ring = 5;
  FormationLemniscate lemniscate = 6;
  FormationLeader leader = 7;
  // 8 and 9 were removed spatial height fields; numbers are reserved, never reused.
  reserved 8, 9, 10;
  // 小队作用域：空 = swarm 级（向后兼容）；非空 = 只作用于该 team_id 的成员。
  string team_id = 11;
}

message FormationSetResponse {
  bool success = 1;
  uint32 error_code = 2;
  FormationTaskEpoch epoch = 3;
  string message = 4;
}

message FormationLeaderTargetRequest {
  FormationLeaderTargetMode target_mode = 1;
  uint64 source_stamp_ns = 2;
  string frame_id = 3;
  org.yunlink.mobility.v1.Pose target_pose = 4;
  string odom_topic = 5;
  // 小队作用域：空 = swarm 级（向后兼容）；非空 = 只作用于该 team_id 的成员。
  // 语义与 `FormationSetRequest.team_id = 11` **完全同口径**（原文透传、trim、空=swarm），
  // 不要另立规则。
  //
  // ⚠️ 这是**安全门禁**字段，不是可选提示：不含本字段的旧桥会按 protobuf 规则**静默忽略**它，
  // 一条"只发给 team_alpha"的长机目标就会退化成"全部小队"——操作员以为只动了一队。
  // 因此两侧必须在**会话 minor 相等且 digest 一致**后才允许下发带 team_id 的请求
  // （地面站侧门禁见 `gateway/src/yunlink_monitor/actions/formation.rs` 的 TEAM_SCOPE_MINOR，
  // 与 `FormationSetRequest.team_id` 的 2.15 门禁同款）。
  string team_id = 6;
}

message FormationLeaderTargetResponse {
  bool success = 1;
  string message = 2;
}

// ===========================================================================
// ↓↓↓ 2.17 新增：**小队目标**（TeamGoal）——与上面的 FormationLeaderTargetRequest
// （阵型虚拟长机目标）**语义无关**，不要混用、不要互相复用通道。
//
// 背景：地面站协作页的"2D 目标点"过去复用了阵型虚拟长机的线协议，于是 Team/协同控制
// 模式下必然撞上阵型那道门，弹出与操作无关的"仅已建立的 Leader 阵型可设置虚拟 leader
// 目标"。本组消息把"小队目标"独立成一条 action：
//   - 收件人 = 该小队的**规划代表**（当前配置固定为 UAV）；
//   - 机侧动作 = 把目标发布到本机规划器目标话题 `<agent_prefix>/move_base_simple/goal`，
//     **不产生任何控制指令**，控制出口仍是既有链路；
//   - 随动成员（UGV）不接收目标：误发给随动成员时明确拒绝并指名该发给谁；
//   - **不写** FormationState.virtual_leader_target*，**不进** swarm_sync 的阵型同步。
//
// ⚠️ team_id 是**必填、非空**字段（不像 FormationSetRequest.team_id /
// FormationLeaderTargetRequest.team_id 的"空 = swarm 级"）：空值或未知 team 一律拒绝。
// 这正是本 action 存在的安全意义——旧通道里"只发一队"会因为旧桥静默忽略 team_id 而
// 退化成"全部小队"；没有"空 = 全部"这个口子，这类事故在协议层就不可能发生。
message TeamGoalRequest {
  // 目标点所在帧（与 FormationLeaderTargetRequest.frame_id 同口径）。
  string frame_id = 1;
  // 源时间戳（地面站采样时刻），用于链路时延观测。
  uint64 source_stamp_ns = 2;
  // 目标位姿：只取 position.x/y 与 yaw；z 由机侧规划器的 goal_z 决定（不要臆造高度）。
  org.yunlink.mobility.v1.Pose target_pose = 3;
  // ★ 必填、非空。空值或未知 team 一律拒绝（success=false + 明确原因）。
  //    与 FormationSetRequest.team_id = 11 的**取值口径**一致（机侧 sunray.team_id 原文），
  //    但**契约强度不同**：这里是必填，不是"空 = swarm 级"。
  string team_id = 4;
}

message TeamGoalResponse {
  // 只表示"已被规划代表接受为目标"，不表示已到达。
  bool success = 1;
  // 操作员可见的原因。
  string message = 2;
  // 回显（便于地面站把结果显示到正确的小队行）。
  string team_id = 3;
  // 接收目标的规划代表（如 "uav1"），便于地面站显示"已下发给谁"。
  string planner_agent_id = 4;
}

// ↓↓↓ 2.12 新增：下发前预览（**零副作用**：不创建任务、不广播、不改机侧任务状态）。
//
// 目的：操作员先看到目标点/几何图形与"现在下发会不会被拒"，再决定是否下发。
// goal 直接复用 FormationSetRequest 的描述（同一份 schema，避免两套几何参数漂移）；
// reference 是阵型参考位姿（非 LEADER 固定零位，LEADER 传拟下发的虚拟领航位姿）。
message FormationPreviewRequest {
  FormationSetRequest goal = 1;
  org.yunlink.mobility.v1.Pose reference = 2;
  // 期望参与成员；留空 = 机侧按自身 swarm_num 取 1..N。
  repeated uint32 member_ids = 3;
}

message FormationPreviewSlot {
  uint32 agent_id = 1;
  org.yunlink.mobility.v1.Pose target = 2;
}

message FormationPreviewResponse {
  // 几何是否可算（与"当前是否会受理"分开：未解锁/未起飞也能预览形状）。
  bool success = 1;
  // 拒绝码沿用 FormationSetResponse.error_code 的同一套常量。
  uint32 error_code = 2;
  string message = 3;
  // 4 原为 mpc_routed（中心化 MPC 已移除）；编号保留，禁止复用。
  reserved 4;
  bool dynamic = 5;
  bool phase_aligned = 6;
  double phase_offset_sec = 7;
  // 逐成员预览目标（槽位来自任务的权威方案，agent_id 可能不等于请求顺序）。
  repeated FormationPreviewSlot slots = 8;
  // 动态阵型的几何图形（一个周期 72 点）；静态阵型为空。
  bool shape_closed = 9;
  repeated FormationShapePoint shape_points = 10;
  // 以当前状态是否会受理（几何合法但未就绪时为 false，原因见 reject_reason）。
  bool would_accept = 11;
  string reject_reason = 12;
}

message FormationStopDynamicRequest {}

message FormationStopDynamicResponse {
  bool success = 1;
  string message = 2;
}

message FormationState {
  uint64 source_stamp_ns = 1;
  string frame_id = 2;
  string agent_id = 3;
  FormationTaskEpoch task_epoch = 4;
  string task_payload_digest = 5;
  uint64 activation_time_domain_ns = 6;
  FormationPhase phase = 7;
  FormationType formation_type = 8;
  bool formation_established = 9;
  bool dynamic_running = 10;
  uint64 dynamic_start_time_domain_ns = 11;
  bool virtual_leader_target_valid = 12;
  org.yunlink.mobility.v1.Pose virtual_leader_target = 13;
  string formation_layout_key = 14;
  bool formation_layout_valid = 15;
  string last_error = 16;
  // 17/18 and 20/21 were removed spatial capability/start-gate fields.
  reserved 17, 18, 20, 21;
  uint64 state_sequence = 19;

  // ↓↓↓ 2.10 新增：本机已受理的编队槽位目标（编号从 22 起，不动已有编号，protobuf 向前兼容）
  //
  // formation_target_valid == false 严格表示"当前没有已受理的编队目标"：此时
  // formation_target 整体缺省（has_formation_target() == false）——既不给零位姿，
  // 也不沿用上一帧。未组队 / 收到 FormationStopDynamic / 离开编队 / 任务 epoch 结束 /
  // 化解编队 / 发生错误时都必须**立即**翻成 false，不等下一个遥测周期。
  bool formation_target_valid = 22;
  // 本机（上报机）已受理的编队槽位目标，与同一条 FormationState.frame_id 同帧表达（米 / 弧度）。
  // 语义是"目标"而非本机实测位姿：静态阵型为固定槽位目标，动态阵型为**当前时刻的瞬时**
  // 槽位目标；两者在收敛前必须与本机实测位姿不同。
  // orientation 至少是有限的平面 yaw 四元数（qz = sin(yaw/2)、qw = cos(yaw/2)、qx = qy = 0）；
  // 地面站只取平面 yaw，roll/pitch 会被忽略，但不允许 NaN/Inf。
  org.yunlink.mobility.v1.Pose formation_target = 23;

  // ↓↓↓ 2.16 新增：虚拟长机目标的小队作用域（编号从 24 起，不动已有编号，protobuf 向前兼容）
  //
  // 本机上报的 `virtual_leader_target` 属于哪个小队域：空串 = swarm 级（全局域），
  // 非空 = 该值就是机侧 `sunray.team_id` 原文。语义与 `FormationSetRequest.team_id = 11`、
  // `FormationLeaderTargetRequest.team_id = 6` **完全同口径**（原文透传、trim、空=swarm）。
  //
  // 为什么必须带：按队分域后，`virtual_leader_target` 只是"**这台机上**生效的那个域的目标"。
  // 地面站若不看本字段，就无法判断该目标是"全部小队"（应画一个圈、标"全部小队"）还是
  // 某一队的（应标到该队）；把别队的目标标到本队，正是过去那次误操作的形态。
  //
  // 仅当 `virtual_leader_target_valid == true` 时本字段才有效；valid == false 时忽略。
  string virtual_leader_team_id = 24;
}

// ↓↓↓ 2.11 新增：动态阵型的**几何图形**（不是逐成员的追逐轨迹）。
//
// 语义：动态多边形 / 动态圆环 / 动态 8 字时，成员沿阵型自身的几何图形前进；该图形在
// 世界系中是静止的，因此每个任务只需要下发一次（流上按 reliable_latest 发布）。
// 静态阵型不发布本消息；valid == false 表示"清除显示"（切静态阵型 / 任务结束 / 被抢占 /
// 故障），此时 points 必须整体缺省（既不给零位姿，也不沿用上一帧）。
message FormationShapePoint {
  double x = 1;
  double y = 2;
  double z = 3;
}

message FormationShape {
  uint64 source_stamp_ns = 1;
  string frame_id = 2;
  string agent_id = 3;
  FormationTaskEpoch task_epoch = 4;
  string task_payload_digest = 5;
  FormationType formation_type = 6;
  bool valid = 7;
  // true = 闭合回路（环 / 多边形周长 / 8 字）；下游需把末点连回首点。
  bool closed = 8;
  // 成员沿图形的前进速度（m/s），仅用于标注/诊断，不是渲染样式。
  double move_speed_mps = 9;
  // 世界系采样点（已含参考位姿），与同一条 frame_id 同帧表达，单位米。
  repeated FormationShapePoint points = 10;
}
