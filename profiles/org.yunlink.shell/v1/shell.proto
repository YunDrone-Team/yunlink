syntax = "proto3";

package org.yunlink.shell.v1;

enum ShellError {
  SHELL_ERROR_UNSPECIFIED = 0;
  SHELL_OK = 1;
  SHELL_DISABLED = 2;
  SHELL_INVALID_REQUEST = 3;
  SHELL_BUSY = 4;
  SHELL_SESSION_NOT_FOUND = 5;
  SHELL_SESSION_MISMATCH = 6;
  SHELL_NOT_RUNNING = 7;
  SHELL_PERMISSION_DENIED = 8;
  SHELL_UNAVAILABLE = 9;
  SHELL_IO_ERROR = 10;
}

message ShellOpenRequest { uint32 cols = 1; uint32 rows = 2; }
message ShellOpenResponse {
  ShellError error = 1;
  string message = 2;
  string session_uid = 3;
  string output_stream_uid = 4;
  string shell_name = 5;
  uint32 cols = 6;
  uint32 rows = 7;
}
message ShellWriteRequest { string session_uid = 1; bytes data = 2; }
message ShellWriteResponse { ShellError error = 1; string message = 2; uint32 bytes_written = 3; }
message ShellResizeRequest { string session_uid = 1; uint32 cols = 2; uint32 rows = 3; }
message ShellResizeResponse { ShellError error = 1; string message = 2; uint32 cols = 3; uint32 rows = 4; }
message ShellCloseRequest { string session_uid = 1; }
message ShellCloseResponse { ShellError error = 1; string message = 2; bool closed = 3; }
